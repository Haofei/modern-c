# Machine-readable review risk register.
#
# Markdown readiness/remediation documents should summarize this file rather than
# carrying independent "open/closed" counters. `admitted_subset_status` records
# whether the currently qualified compiler subset has evidence; `status` records
# the broader platform/production work item.

risks:
  - id: SCOPE-PRODUCT-SURFACE
    severity: high
    scope: project-governance
    status: open
    admitted_subset_status: current-worktree-continues-development
    blocks:
      - unrestricted-production-compiler
      - production-kernel
      - stable-release
    summary: Product surface spans compiler, dual backends, selfhost, kernel, Agent runtime, LSP, release provenance, and multiple runtime TCBs before the core semantic boundary is stable.

  - id: ARCH-COMPILATION-SESSION
    severity: high
    scope: compiler-platform
    status: closed
    admitted_subset_status: request-scoped-session-gated
    blocks: []
    summary: Process-global compilation state has been replaced by request-scoped CompilationSession helpers for compile-like CLI commands; compilation-session-inventory-test keeps the seam anchored.

  - id: ARCH-TYPED-MIR
    severity: high
    scope: compiler-platform
    status: open
    admitted_subset_status: qualified-supported-subset
    blocks:
      - unrestricted-production-compiler
      - third-party-backend-api
    summary: Migrate MIR type/value/symbol identity away from strings and AST TypeExpr side channels.

  - id: ARCH-HIR-AUTHORITY
    severity: medium
    scope: compiler-architecture
    status: closed
    admitted_subset_status: inspection-only-gated
    blocks: []
    summary: HIR is explicitly documented and tested as an inspection-only projection; MIR verification remains the backend production boundary.

  - id: ARCH-BACKEND-FACTS
    severity: high
    scope: compiler-backend
    status: open
    admitted_subset_status: qualified-supported-subset
    blocks:
      - unrestricted-production-compiler
      - backend-conformance-claim
    summary: Remove backend-local semantic inference; backends should consume only verified typed facts.

  - id: BACKEND-LLVM-PROFILE
    severity: medium
    scope: compiler-backend
    status: open
    admitted_subset_status: differential-and-experimental-profile
    blocks:
      - llvm-production-backend-claim
    summary: LLVM backend remains valuable for differential testing but should not be treated as equal production authority until typed MIR/fact boundaries are complete.

  - id: ARCH-SOURCE-MAP-DIGEST
    severity: medium
    scope: artifact-provenance
    status: open
    admitted_subset_status: c-artifact-source-map-digest-gated
    blocks:
      - release-debug-provenance-claim
    summary: C/source-map-bearing artifacts now bind generated artifact, source-map generated artifact, source-map payload, MIR facts, source digest, lowering options, and toolchain identity where applicable; full LLVM debug/source-map release provenance remains open.

  - id: SELFHOST-PROFILE
    severity: medium
    scope: selfhost
    status: open
    admitted_subset_status: experimental-bootstrap-subset
    blocks:
      - selfhost-production-compiler-claim
    summary: Selfhost is a bootstrap experiment and should not become a second semantic authority while the main compiler IR/fact boundary is still moving.

  - id: GATE-MANIFEST
    severity: medium
    scope: build-governance
    status: open
    admitted_subset_status: compiler-core-governance-manifest-gated
    blocks:
      - generated-release-evidence
    summary: Compiler-core, governance, provenance, release, profile, vendoring, license, and CI anti-vacuity gates are checked against build tiers; full build/CI/release/docs generation from one manifest remains open.

  - id: LSP-COMPILER-SERVICE
    severity: medium
    scope: developer-tools
    status: open
    admitted_subset_status: subprocess-isolated-lsp
    blocks:
      - low-latency-incremental-lsp-claim
    summary: LSP currently has substantial subprocess orchestration because no persistent query-based compiler service exists yet.

  - id: KERNEL-VERIFIED-BUNDLE
    severity: critical
    scope: kernel-secure-boot
    status: open
    admitted_subset_status: exact-byte-prototype-gated
    blocks:
      - production-kernel
      - secure-boot-claim
      - untrusted-agent-loading
    summary: A production-shaped exact-byte VerifiedBundle wrapper now binds current image bytes with a SHA-256 digest before ELF loading, admission consumes an opaque signature proof token instead of a caller boolean, an optional RSA/BearSSL adapter can mint that proof from a real RSA-2048/SHA-256 image signature, proof/root minting and raw ELF loader call sites are source-audited to approved TCB/fixture files, and the app-run compatibility entry routes through that token path. Production canonical-header signing, key-policy provenance, persistence/audit identity, anti-rollback storage, and hardware qualification remain open.

  - id: KERNEL-CAPABILITY-MINT
    severity: high
    scope: kernel-capability
    status: open
    admitted_subset_status: authority-token-gated-prototype
    blocks:
      - third-party-kernel-components
      - production-kernel
    summary: Privileged capability/right mint APIs now require explicit opaque root tokens and the source audit gates root creation; production boot authority provenance and delegation policy remain open.

  - id: SUPPLY-TCB-CVE-INTAKE
    severity: high
    scope: supply-chain
    status: open
    admitted_subset_status: advisory-intake-manifest-gated
    blocks:
      - stable-release
      - production-kernel
    summary: Vendored BearSSL, QuickJS, WAMR, openlibm, OpenSBI, real-board firmware, and the selected Agent runtime slot now have gated offline advisory-intake metadata, retained-subset/profile-slot policy, review dates, and waiver fields; live advisory ingestion, concrete production firmware/runtime selection, release response SLA, and production waiver review remain open.

  - id: TCB-PROFILE-MINIMIZATION
    severity: medium
    scope: supply-chain
    status: open
    admitted_subset_status: profile-and-tcb-component-manifests-gated
    blocks:
      - production-profile-minimal-tcb-claim
    summary: Product profiles now name their TCB components in profile-manifest.json, and vendored/firmware/profile-slot advisory-intake manifests are gated; minimal production TCB claims still require concrete profile-specific firmware/runtime closure.

  - id: HARDWARE-PRODUCTION-QUALIFICATION
    severity: high
    scope: hardware
    status: open
    admitted_subset_status: qemu-surrogate-qualified
    blocks:
      - production-kernel
      - real-device-support-claim
    summary: Real board boot, soak, power-loss, storage, network, DMA/cache, and interrupt qualification remain required.
