# Machine-readable review risk register.
#
# Markdown validation/remediation documents should summarize this file rather than
# carrying independent "open/closed" counters. `admitted_subset_status` records
# whether the currently qualified compiler subset has evidence; `status` records
# the broader platform/production work item.

risks:
  - id: SCOPE-PRODUCT-SURFACE
    severity: high
    scope: project-governance
    status: open
    admitted_subset_status: current-worktree-continues-development
    blocks:
      - unrestricted-production-compiler
      - stable-release
    summary: Product surface spans compiler, dual backends, kernel/QEMU workloads, kernel validation demos, release provenance, and multiple runtime profiles before the core semantic boundary is stable; deployable kernel and editor-product claims have been retired.

  - id: ARCH-COMPILATION-SESSION
    severity: high
    scope: compiler-platform
    status: closed
    admitted_subset_status: request-scoped-session-gated
    blocks: []
    summary: Process-global compilation state has been replaced by request-scoped CompilationSession helpers for compile-like CLI commands; compilation-session-inventory-test keeps the seam anchored.

  - id: ARCH-TYPED-MIR
    severity: high
    scope: compiler-platform
    status: open
    admitted_subset_status: qualified-supported-subset
    blocks:
      - unrestricted-production-compiler
      - third-party-backend-api
    summary: Migrate MIR type/value/symbol identity away from strings and AST TypeExpr side channels.

  - id: ARCH-HIR-AUTHORITY
    severity: medium
    scope: compiler-architecture
    status: closed
    admitted_subset_status: inspection-only-gated
    blocks: []
    summary: HIR is explicitly documented and tested as an inspection-only projection; MIR verification remains the backend production boundary.

  - id: ARCH-BACKEND-FACTS
    severity: high
    scope: compiler-backend
    status: open
    admitted_subset_status: qualified-supported-subset
    blocks:
      - unrestricted-production-compiler
      - backend-conformance-claim
    summary: Remove backend-local semantic inference; backends should consume only verified typed facts.

  - id: BACKEND-LLVM-PROFILE
    severity: medium
    scope: compiler-backend
    status: open
    admitted_subset_status: differential-and-experimental-profile
    blocks:
      - llvm-production-backend-claim
    summary: LLVM backend remains valuable for differential testing but should not be treated as equal production authority until typed MIR/fact boundaries are complete.

  - id: ARCH-SOURCE-MAP-DIGEST
    severity: medium
    scope: artifact-provenance
    status: open
    admitted_subset_status: c-artifact-source-map-digest-gated
    blocks:
      - release-debug-provenance-claim
    summary: C/source-map-bearing artifacts now bind generated artifact, source-map generated artifact, source-map payload, MIR facts, source digest, lowering options, and toolchain identity where applicable; full LLVM debug/source-map release provenance remains open.

  - id: GATE-MANIFEST
    severity: medium
    scope: build-governance
    status: open
    admitted_subset_status: compiler-core-governance-manifest-gated
    blocks:
      - generated-release-evidence
    summary: Compiler-core, governance, provenance, release, profile, vendoring, license, and CI anti-vacuity gates are checked against build tiers; full build/CI/release/docs generation from one manifest remains open.

  - id: KERNEL-CAPABILITY-MINT
    severity: high
    scope: kernel-capability
    status: open
    admitted_subset_status: authority-token-gated-prototype
    blocks:
      - third-party-kernel-components
    summary: Privileged capability/right mint APIs now require explicit opaque root tokens and the source audit gates root creation; this remains relevant to kernel/QEMU validation but no longer backs a deployable kernel release profile.

  - id: COMPONENT-PROFILE-MINIMIZATION
    severity: medium
    scope: supply-chain
    status: open
    admitted_subset_status: profile-component-manifest-retained
    blocks:
      - production-profile-minimal-component-claim
    summary: Profile component manifests are retained only as dependency/provenance bookkeeping. Kernel-QEMU is a language-validation workload and no longer carries a gated security-advisory workflow or minimal product-component claim.

  - id: HARDWARE-PRODUCTION-QUALIFICATION
    severity: high
    scope: hardware
    status: open
    admitted_subset_status: qemu-surrogate-qualified
    blocks:
      - real-device-support-claim
    summary: Real board boot, soak, power-loss, storage, network, DMA/cache, and interrupt qualification remain outside the active kernel-QEMU validation profile.
